<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTA HMI Mimika - Cetak</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family:'Poppins', sans-serif; margin:0; padding:0; background:#f0f0f0; }
.hidden { display:none; }
.kta-card { 
  background:white; border-radius:1rem; box-shadow:0 4px 10px rgba(0,0,0,0.1); 
  display:flex; gap:1rem; padding:1rem; align-items:flex-start; 
  position:relative; overflow:hidden; border:2px solid #2d5016; 
}
.kta-left { width:120px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; }
.kta-left img { border-radius:0.75rem; object-fit:cover; width:100px; height:120px; border:2px solid #2d5016; }
.kta-right { flex:1; display:flex; flex-direction:column; justify-content:space-between; }
.kta-right h2 { font-size:1.1rem; font-weight:700; margin-bottom:0.25rem; }
.kta-right p { font-size:0.85rem; margin:1px 0; }
.kta-ttd-qr { display:flex; justify-content:space-between; align-items:center; margin-top:0.5rem; }
.kta-ttd-qr img { width:80px; height:40px; object-fit:contain; }
.kta-qr { display:flex; flex-direction:column; align-items:center; font-size:0.65rem; }
.timestamp { font-size:0.6rem; color:#555; margin-top:4px; text-align:right; }

@media print {
  body { background:white; }
  .kta-card { page-break-inside: avoid; }
}
</style>
</head>
<body class="p-6">

<!-- LOGIN -->
<div id="login-screen" class="max-w-md mx-auto bg-white p-6 rounded-xl shadow">
  <h2 class="text-2xl font-bold mb-4 text-center text-green-800">Login KTA HMI Mimika</h2>
  <input id="username" placeholder="Username" class="border p-2 w-full mb-3 rounded">
  <input id="password" type="password" placeholder="Password" class="border p-2 w-full mb-4 rounded">
  <button id="login-btn" class="bg-green-700 text-white w-full py-2 rounded">Login</button>
  <p id="login-error" class="text-red-600 mt-2 hidden text-center">Username atau password salah!</p>
</div>

<!-- KTA SCREEN -->
<div id="kta-screen" class="hidden">
  <div class="mb-4 flex gap-4">
    <button id="generate-btn" class="bg-green-700 text-white px-6 py-2 rounded font-semibold">Cetak / Print KTA</button>
    <button id="download-btn" class="bg-blue-600 text-white px-6 py-2 rounded font-semibold">Download PDF Semua</button>
  </div>
  <div id="kta-container" class="grid grid-cols-2 gap-6"></div>
</div>

<script>
// ==== LOGIN ====
const users = { admin: 'admin123', ekonomi: 'eko123', insan: 'insan123', lafran: 'lafran123' };
document.getElementById('login-btn').addEventListener('click', () => {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  if(users[u] && users[u] === p){
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('kta-screen').classList.remove('hidden');
    initApp(); // render KTA setelah login
  } else {
    document.getElementById('login-error').classList.remove('hidden');
  }
});

// ==== DATA CSV & DEFAULT TTD ====
const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSaGF4w9j1HOTUJcpdBltUZ4N2hkZIqUpD6tJ4OkKkuHaYkWObiKnloTYC0rK1at5UYA16GmPUm7BNa/pub?gid=0&single=true&output=csv';
const defaultTTD = 'https://raw.githubusercontent.com/prayogas221/KTAHMIMIMIKA/532122c56719c026efcea792e03b13f7ddc44127/ttd.png';
let membersData = [];

// ==== LOAD MEMBERS ====
async function loadMembers(){
  const res = await fetch(csvUrl);
  const text = await res.text();
  const rows = text.split('\n').slice(1);
  membersData = rows.map(r=>{
    const cols = r.split(',');
    return {
      id: cols[0],
      nik: cols[3],
      nama: cols[4],
      komisariat: cols[13],
      status: cols[10],
      foto: cols[14] || 'https://via.placeholder.com/100x120?text=Foto',
      ttd: cols[15] || defaultTTD
    };
  });
}

// ==== GENERATE QR ====
async function generateQR(text){
  return await QRCode.toDataURL(text,{width:100, margin:1});
}

// ==== RENDER KTA ====
async function renderKTA(){
  const container = document.getElementById('kta-container');
  container.innerHTML = '';
  const now = new Date();
  const timestamp = now.toLocaleString();
  for(const m of membersData){
    const qr = await generateQR(m.id);
    const card = document.createElement('div');
    card.className = 'kta-card';
    card.innerHTML = `
      <div class="kta-left">
        <img src="${m.foto}" alt="Foto">
      </div>
      <div class="kta-right">
        <div>
          <h2>${m.nama}</h2>
          <p>NIK: ${m.nik}</p>
          <p>Komisariat: ${m.komisariat}</p>
          <p>Status: ${m.status}</p>
        </div>
        <div class="kta-ttd-qr">
          <img src="${m.ttd}" alt="TTD" class="kta-ttd">
          <div class="kta-qr">
            <img src="${qr}" alt="QR">
            <span>${m.id}</span>
          </div>
        </div>
        <div class="timestamp">Dicetak: ${timestamp}</div>
      </div>
    `;
    container.appendChild(card);
  }
}

// ==== PRINT / PDF ====
document.getElementById('generate-btn').addEventListener('click', ()=>window.print());
document.getElementById('download-btn').addEventListener('click', async ()=>{
  const container = document.getElementById('kta-container');
  await Promise.all(Array.from(container.querySelectorAll('img')).map(img=>img.complete?Promise.resolve():new Promise(res=>img.onload=res)));
  html2pdf().set({
    margin:0.2,
    filename:'KTA_All.pdf',
    html2canvas:{scale:2,useCORS:true,allowTaint:true},
    jsPDF:{unit:'in',format:'a4',orientation:'portrait'}
  }).from(container).save();
});

// ==== INIT APP ====
async function initApp(){
  await loadMembers();
  await renderKTA();
}
</script>

</body>
</html>
