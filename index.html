<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTA HMI Mimika - Cetak</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family:'Poppins', sans-serif; margin:0; padding:0; background:#f0f0f0; }
.kta-card { 
  background:white; border-radius:1rem; box-shadow:0 4px 10px rgba(0,0,0,0.1); 
  display:flex; gap:1rem; padding:1rem; align-items:flex-start; 
  position:relative; overflow:hidden;
}
.kta-left { width:120px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; }
.kta-left img { border-radius:0.75rem; object-fit:cover; width:100px; height:120px; border:2px solid #2d5016; }
.kta-right { flex:1; display:flex; flex-direction:column; justify-content:space-between; }
.kta-right h2 { font-size:1.1rem; font-weight:700; margin-bottom:0.25rem; }
.kta-right p { font-size:0.85rem; margin:1px 0; }
.kta-ttd-qr { display:flex; justify-content:space-between; align-items:center; margin-top:0.5rem; }
.kta-ttd-qr img { width:80px; height:40px; object-fit:contain; }
.kta-qr { display:flex; flex-direction:column; align-items:center; font-size:0.65rem; }
.timestamp { font-size:0.6rem; color:#555; margin-top:4px; text-align:right; }

@media print {
  body { background:white; }
  .kta-card { page-break-inside: avoid; }
}
</style>
</head>
<body class="p-6">

<div class="mb-4 flex flex-col md:flex-row md:items-center md:gap-4">
  <select id="komisariatFilter" class="px-4 py-2 border rounded" onchange="generateKTA()">
    <option value="all">Semua Komisariat</option>
  </select>
  <div class="flex gap-2 mt-2 md:mt-0">
    <button onclick="generateKTA()" class="bg-green-700 text-white px-6 py-2 rounded font-semibold">Cetak / Print KTA</button>
    <button onclick="downloadPDF()" class="bg-blue-600 text-white px-6 py-2 rounded font-semibold">Download PDF Semua</button>
  </div>
</div>

<div id="kta-container" class="grid grid-cols-2 gap-6"></div>

<script>
// Link CSV anggota
const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSaGF4w9j1HOTUJcpdBltUZ4N2hkZIqUpD6tJ4OkKkuHaYkWObiKnloTYC0rK1at5UYA16GmPUm7BNa/pub?gid=0&single=true&output=csv';

// Default TTD (bisa ganti link ke ttd.png GitHub)
const defaultTTD = 'https://raw.githubusercontent.com/prayogas221/KTAHMIMIMIKA/532122c56719c026efcea792e03b13f7ddc44127/ttd.png';

let membersData = [];
let komisariatList = [];

// Ambil CSV & parse
async function loadMembers(){
  const res = await fetch(csvUrl);
  const text = await res.text();
  const rows = text.split('\n').slice(1);
  membersData = rows.map(r=>{
    const cols = r.split(',');
    return {
      id: cols[0],
      nik: cols[3],
      nama: cols[4],
      komisariat: cols[13],
      status: cols[10],
      foto: cols[14] || 'https://via.placeholder.com/100x120?text=Foto',
      ttd: cols[15] || defaultTTD
    };
  });

  // Buat daftar komisariat unik
  komisariatList = [...new Set(membersData.map(m => m.komisariat))].filter(k => k);
  const select = document.getElementById('komisariatFilter');
  komisariatList.forEach(k => {
    const option = document.createElement('option');
    option.value = k;
    option.textContent = k;
    select.appendChild(option);
  });
}

// Generate QR Base64
async function generateQR(text){
  return await QRCode.toDataURL(text,{width:100, margin:1});
}

// Render KTA
async function generateKTA(){
  const container = document.getElementById('kta-container');
  container.innerHTML = '';
  const now = new Date();
  const timestamp = now.toLocaleString();
  const filter = document.getElementById('komisariatFilter').value;

  const filteredMembers = filter === 'all' ? membersData : membersData.filter(m => m.komisariat === filter);

  for(const m of filteredMembers){
    const qr = await generateQR(m.id);
    const card = document.createElement('div');
    card.className = 'kta-card';
    card.innerHTML = `
      <div class="kta-left">
        <img src="${m.foto}" alt="Foto">
      </div>
      <div class="kta-right">
        <div>
          <h2>${m.nama}</h2>
          <p>NIK: ${m.nik}</p>
          <p>Komisariat: ${m.komisariat}</p>
          <p>Status: ${m.status}</p>
        </div>
        <div class="kta-ttd-qr">
          <img src="${m.ttd}" alt="TTD" class="kta-ttd">
          <div class="kta-qr">
            <img src="${qr}" alt="QR">
            <span>${m.id}</span>
          </div>
        </div>
        <div class="timestamp">Dicetak: ${timestamp}</div>
      </div>
    `;
    container.appendChild(card);
  }
}

// Download PDF semua KTA
async function downloadPDF(){
  const container = document.getElementById('kta-container');
  await Promise.all(Array.from(container.querySelectorAll('img')).map(img=>{
    if(img.complete) return Promise.resolve();
    return new Promise(res=>img.onload=res);
  }));
  html2pdf().set({
    margin:0.2,
    filename:'KTA_All.pdf',
    html2canvas:{scale:2, useCORS:true, allowTaint:true},
    jsPDF:{unit:'in', format:'a4', orientation:'portrait'}
  }).from(container).save();
}

// Inisialisasi
(async()=>{ await loadMembers(); generateKTA(); })();
</script>

</body>
</html>
