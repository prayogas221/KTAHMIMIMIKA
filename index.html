<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Database & Cetak KTA HMI Mimika</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body { font-family: system-ui; background: #f1f5f9; }
.hidden { display: none; }
@media print {
  body { background: white; }
  .no-print { display: none; }
}
.kta-card {
  display: flex;
  background: white;
  border-radius: 16px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  overflow: hidden;
  height: 180px;
  position: relative;
  font-size: 14px;
}
.kta-left, .kta-right {
  width: 8px;
  background: linear-gradient(180deg, #0f3d1e, #000000);
}
.kta-content {
  flex: 1;
  display: flex;
  padding: 12px 16px;
  align-items: center;
  gap: 12px;
}
.kta-photo {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.kta-photo img.foto { width: 72px; height: 92px; object-fit: cover; border-radius: 12px; border: 2px solid #0f3d1e; }
.kta-photo img.ttd { width: 64px; height: 32px; margin-top: 2px; }
.kta-info { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.kta-info h2 { font-size: 16px; font-weight: bold; color: #0f3d1e; }
.kta-info p { margin: 0; color: #333; font-size: 13px; }
.kta-qr { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.kta-qr img { width: 64px; height: 64px; border: 2px solid #0f3d1e; border-radius: 8px; }
.timestamp { font-size: 10px; color: #888; margin-top: 2px; text-align: center; }
</style>
</head>
<body class="p-4">

<!-- LOGIN -->
<div id="loginBox" class="max-w-md mx-auto bg-white p-6 rounded-xl shadow">
  <h2 class="text-2xl font-bold mb-4 text-center">Login Database HMI Mimika</h2>
  <input id="user" placeholder="Username" class="border p-2 w-full mb-3 rounded">
  <input id="pass" type="password" placeholder="Password" class="border p-2 w-full mb-4 rounded">
  <button onclick="login()" class="bg-green-700 text-white w-full py-2 rounded">Masuk</button>
  <p id="loginErr" class="text-red-600 mt-2 hidden text-center">Login salah</p>
</div>

<!-- APP -->
<div id="app" class="hidden">

<header class="bg-gradient-to-r from-green-800 to-yellow-500 text-white text-center p-5 rounded-3xl shadow mb-6">
  <h1 class="text-3xl font-bold">DATABASE HMI MIMIKA</h1>
  <p id="roleText" class="mt-1 text-sm"></p>
</header>

<div class="flex gap-3 mb-6 justify-center no-print">
  <button onclick="showTab('data')" class="btn bg-gray-200 px-3 py-1 rounded">📋 Data</button>
  <button onclick="showTab('cetak')" class="btn bg-gray-200 px-3 py-1 rounded">🖨️ Cetak KTA</button>
</div>

<!-- DATA -->
<div id="data" class="tabPage bg-white p-5 rounded-xl shadow">
  <div class="flex justify-between mb-3 no-print">
    <input id="search" oninput="render()" placeholder="Cari nama / NIK" class="border p-2 rounded w-1/2">
  </div>
  <div class="overflow-auto">
    <table class="w-full text-sm border">
      <thead class="bg-amber-700 text-white">
        <tr>
          <th class="p-2 border">Nama</th>
          <th class="p-2 border">NIK</th>
          <th class="p-2 border">Komisariat</th>
          <th class="p-2 border">Status</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- CETAK -->
<div id="cetak" class="tabPage hidden">
<div class="no-print flex justify-center gap-3 mb-4">
  <button onclick="downloadPDFA4()" class="bg-green-700 text-white px-6 py-2 rounded">🖨️ CETAK PDF A4</button>
</div>
<div id="printArea" class="flex flex-col gap-4"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script>
// USER
const USERS={ ekonomi:{pass:"12345",kom:"Komisariat Ekonomi"}, cabang:{pass:"12345",kom:"ALL"} };
let role=""; let rows=[
  // contoh data anggota: [id, nama, NIK, komisariat, status, foto Base64]
  ["1","Prayoga Romin Saputra","123456789","Komisariat Ekonomi","Aktif","","data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHe..."]
];

// LOGIN
function login(){ 
  let u=user.value.trim(); let p=pass.value; 
  if(USERS[u] && USERS[u].pass===p){
    role=USERS[u].kom;
    loginBox.classList.add("hidden");
    app.classList.remove("hidden");
    roleText.innerText="Akses: "+role;
    render(); renderPrint();
  } else loginErr.classList.remove("hidden");
}

// FILTER
function filterRows(){ return rows.filter(r=>role==="ALL"||r[3]===role); }

// RENDER DATA TABLE
function render(){
  tbody.innerHTML=filterRows().map(r=>{
    return `<tr>
      <td class="border p-1">${r[1]}</td>
      <td class="border p-1">${r[2]}</td>
      <td class="border p-1">${r[3]}</td>
      <td class="border p-1">${r[4]}</td>
    </tr>`;
  }).join("");
}

// GENERATE QR
async function generateQR(data){
  return await QRCode.toDataURL(data,{width:80,margin:1});
}

// RENDER PRINT AREA
const ttdBase64 = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAFQAAAAoCAYAAABy3EIAAAABG0lEQVR4nO3XsQkAMAwAsP3/t4t0hZBhnHUFq0BybCX+2P5JtqQk2bNmyZNmzZsmTJkyZMmTBl/l9g2dYwGJfQ2S6eN+ADwHYW8CO1TffypfqCQ9l7F2yU9A1ZYR5l5FAe64QEo9kW+whocZfNE3Zg1g3s0t52/Z6g1oyXwWzltcHwlZ9L4I2G7AQze7zvQYpYHcd3ffZsY20D/gzZ5jhmv/YlBz6eJ1AC0AAAAASUVORK5CYII=";

async function renderPrint(){
  const printArea = document.getElementById("printArea");
  printArea.innerHTML="";
  const d = filterRows();
  const now = new Date();
  const timestamp = now.toLocaleString();

  for(const r of d){
    const qrBase64 = await generateQR(r[0]);
    const foto = r[5]||"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAABG0lEQVR4nO3XsQkAMAwAsP3/t4t0hZBhnHUFq0BybCX+2P5JtqQk2bNmyZNmzZsmTJkyZMmTBl/l9g2dYwGJfQ2S6eN+ADwHYW8CO1TffypfqCQ9l7F2yU9A1ZYR5l5FAe64QEo9kW+whocZfNE3Zg1g3s0t52/Z6g1oyXwWzltcHwlZ9L4I2G7AQze7zvQYpYHcd3ffZsY20D/gzZ5jhmv/YlBz6eJ1AC0AAAAASUVORK5CYII=";

    const card = document.createElement("div");
    card.className="kta-card";

    card.innerHTML=`
      <div class="kta-left"></div>
      <div class="kta-content">
        <div class="kta-photo">
          <img class="foto" src="${foto}">
          <img class="ttd" src="${ttdBase64}">
        </div>
        <div class="kta-info">
          <h2>${r[1]}</h2>
          <p>NIK: ${r[2]}</p>
          <p>Komisariat: ${r[3]}</p>
          <p>Status: ${r[4]}</p>
        </div>
        <div class="kta-qr">
          <img src="${qrBase64}">
          <span class="timestamp">${timestamp}</span>
        </div>
      </div>
      <div class="kta-right"></div>
    `;
    printArea.appendChild(card);
  }
}

// DOWNLOAD PDF A4
async function downloadPDFA4(){
  const printArea = document.getElementById("printArea");
  const imgs = printArea.querySelectorAll("img");
  await Promise.all(Array.from(imgs).map(img=>{
    if(img.complete) return Promise.resolve();
    return new Promise(res=>img.onload=res);
  }));

  html2pdf().set({
    margin:0.2,
    filename:'KTA_All.pdf',
    html2canvas:{scale:2,useCORS:true,allowTaint:true},
    jsPDF:{unit:'in', format:'a4', orientation:'portrait'}
  }).from(printArea).save();
}

// TAB
function showTab(id){
  document.querySelectorAll(".tabPage").forEach(x=>x.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}
</script>
</body>
</html>
