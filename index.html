<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTA HMI Mimika - Cetak (All-Access)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family:'Poppins', sans-serif; margin:0; padding:0; background:#f0f0f0; }
.hidden { display:none; }

/* KTA Card */
.kta-card { 
  background:white; 
  border: 2px solid #2d5016;
  border-radius:1rem; 
  box-shadow:0 4px 10px rgba(0,0,0,0.1); 
  display:flex; 
  gap:1rem; 
  padding:1rem; 
  align-items:flex-start; 
  overflow:hidden;
  page-break-inside: avoid; 
  width:100%; 
  box-sizing:border-box;
}
.kta-left { 
  width:120px; 
  flex-shrink:0; 
  display:flex; 
  flex-direction:column; 
  align-items:center; 
  border-right: 1px solid #2d5016; 
  padding-right: 0.5rem;
}
.kta-left img { 
  border-radius:0.75rem; 
  object-fit:cover; 
  width:100px; 
  height:120px; 
  border:2px solid #2d5016; 
}
.kta-right { 
  flex:1; 
  display:flex; 
  flex-direction:column; 
  justify-content:space-between; 
  padding-left:0.5rem;
}
.kta-right h2 { font-size:1.1rem; font-weight:700; margin-bottom:0.25rem; }
.kta-right p { font-size:0.85rem; margin:1px 0; }
.kta-ttd-qr { display:flex; justify-content:space-between; align-items:center; margin-top:0.5rem; }
.kta-ttd-qr img { width:80px; height:40px; object-fit:contain; }
.kta-qr { display:flex; flex-direction:column; align-items:center; font-size:0.65rem; }
.timestamp { font-size:0.6rem; color:#555; margin-top:4px; text-align:right; }

/* Cetak A4 */
@media print {
  body { background:white; padding:0; }
  #kta-container {
    display:grid;
    grid-template-columns: 1fr 1fr; 
    gap:1cm; 
  }
  .kta-card {
    box-shadow:none; 
    break-inside: avoid; 
    width:100%; 
    min-height:5cm;
  }
}
</style>
</head>
<body class="p-6">

<!-- Login Form -->
<div id="login-form" class="max-w-sm mx-auto mt-20 p-6 bg-white rounded shadow">
  <h1 class="text-2xl font-bold mb-4 text-center">Login Komisariat / Cabang</h1>
  <div class="mb-4">
    <label class="block mb-1 font-semibold">Username</label>
    <input type="text" id="username" class="w-full px-3 py-2 border rounded" placeholder="Nama komisariat / cabang">
  </div>
  <div class="mb-4">
    <label class="block mb-1 font-semibold">Password</label>
    <input type="password" id="password" class="w-full px-3 py-2 border rounded" placeholder="Password">
  </div>
  <button onclick="login()" class="w-full bg-green-700 text-white py-2 rounded font-semibold">Login</button>
  <p id="login-error" class="text-red-500 mt-2 hidden text-center">Username atau password salah!</p>
</div>

<!-- KTA Page -->
<div id="kta-page" class="hidden">
  <div class="mb-4 flex flex-col md:flex-row md:items-center md:gap-4">
    <select id="komisariatFilter" class="px-4 py-2 border rounded" disabled></select>
    <div class="flex gap-2 mt-2 md:mt-0">
      <button onclick="generateKTA()" class="bg-green-700 text-white px-6 py-2 rounded font-semibold">Cetak / Print KTA</button>
      <button onclick="downloadPDF()" class="bg-blue-600 text-white px-6 py-2 rounded font-semibold">Download PDF Semua</button>
      <button onclick="logout()" class="bg-gray-600 text-white px-6 py-2 rounded font-semibold">Logout</button>
    </div>
  </div>
  <div id="kta-container" class="grid grid-cols-2 gap-6"></div>
</div>

<script>
// Users: komisariat + cabang all-access
const users = {
  "Komisariat Ekonomi": { password:"ekonomi123", type:"komisariat", cabang:"Mimika" },
  "Komisariat Insan Cita": { password:"insancita123", type:"komisariat", cabang:"Mimika" },
  "Komisariat Lafran Pane": { password:"lafran123", type:"komisariat", cabang:"Mimika" },
  "Cabang Mimika": { password:"cabang123", type:"cabang", cabang:"Mimika" } // all-access
};

// CSV Link
const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSaGF4w9j1HOTUJcpdBltUZ4N2hkZIqUpD6tJ4OkKkuHaYkWObiKnloTYC0rK1at5UYA16GmPUm7BNa/pub?gid=0&single=true&output=csv';

// Default TTD
const defaultTTD = 'https://raw.githubusercontent.com/prayogas221/KTAHMIMIMIKA/532122c56719c026efcea792e03b13f7ddc44127/ttd.png';

let membersData = [];
let currentKomisariat = "";

// Load CSV
async function loadMembers(){
  const res = await fetch(csvUrl);
  const text = await res.text();
  const rows = text.split('\n').slice(1);
  membersData = rows.map(r=>{
    const cols = r.split(',');
    return {
      id: cols[0],
      nik: cols[3],
      nama: cols[4],
      komisariat: cols[13],
      cabang: cols[12] || "Mimika",
      status: cols[10],
      foto: cols[14] || 'https://via.placeholder.com/100x120?text=Foto',
      ttd: cols[15] || defaultTTD
    };
  });
}

// Login
function login(){
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  const error = document.getElementById('login-error');

  if(users[u] && users[u].password === p){
    const userType = users[u].type;
    const userCabang = users[u].cabang;
    document.getElementById('login-form').classList.add('hidden');
    document.getElementById('kta-page').classList.remove('hidden');

    const select = document.getElementById('komisariatFilter');

    if(userType==="komisariat"){
      currentKomisariat = u;
      select.innerHTML = `<option value="${currentKomisariat}">${currentKomisariat}</option>`;
      select.disabled = true;
    } else {
      currentKomisariat = "all";
      const komisariatSet = new Set(membersData.filter(m=>m.cabang===userCabang).map(m=>m.komisariat));
      select.innerHTML = '<option value="all">Semua Komisariat</option>' + 
        Array.from(komisariatSet).map(k=>`<option value="${k}">${k}</option>`).join('');
      select.disabled = false;
    }

    generateKTA();
    error.classList.add('hidden');
  } else {
    error.classList.remove('hidden');
  }
}

// Logout
function logout(){
  currentKomisariat = "";
  document.getElementById('kta-page').classList.add('hidden');
  document.getElementById('login-form').classList.remove('hidden');
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
}

// QR
async function generateQR(text){
  return await QRCode.toDataURL(text,{width:100, margin:1});
}

// Generate KTA
async function generateKTA(){
  const container = document.getElementById('kta-container');
  container.innerHTML = '';
  const now = new Date();
  const timestamp = now.toLocaleString();

  const filterValue = document.getElementById('komisariatFilter').value;
  let filteredMembers;

  if(currentKomisariat==="all"){
    if(filterValue==="all"){
      filteredMembers = membersData.filter(m => m.cabang === users["Cabang Mimika"].cabang);
    } else {
      filteredMembers = membersData.filter(m => m.komisariat === filterValue);
    }
  } else {
    filteredMembers = membersData.filter(m => m.komisariat === currentKomisariat);
  }

  for(const m of filteredMembers){
    const qr = await generateQR(m.id);
    const card = document.createElement('div');
    card.className = 'kta-card';
    card.innerHTML = `
      <div class="kta-left">
        <img src="${m.foto}" alt="Foto">
      </div>
      <div class="kta-right">
        <div>
          <h2>${m.nama}</h2>
          <p>NIK: ${m.nik}</p>
          <p>Komisariat: ${m.komisariat}</p>
          <p>Cabang: ${m.cabang}</p>
          <p>Status: ${m.status}</p>
        </div>
        <div class="kta-ttd-qr">
          <img src="${m.ttd}" alt="TTD" class="kta-ttd">
          <div class="kta-qr">
            <img src="${qr}" alt="QR">
            <span>${m.id}</span>
          </div>
        </div>
        <div class="timestamp">Dicetak: ${timestamp}</div>
      </div>
    `;
    container.appendChild(card);
  }
}

// Download PDF
async function downloadPDF(){
  const container = document.getElementById('kta-container');
  await Promise.all(Array.from(container.querySelectorAll('img')).map(img=>{
    if(img.complete) return Promise.resolve();
    return new Promise(res=>img.onload=res);
  }));
  html2pdf().set({
    margin:0.2,
    filename:`KTA_${currentKomisariat}.pdf`,
    html2canvas:{scale:2, useCORS:true, allowTaint:true},
    jsPDF:{unit:'in', format:'a4', orientation:'portrait'}
  }).from(container).save();
}

// Inisialisasi
(async()=>{ await loadMembers(); })();
</script>

</body>
</html>
