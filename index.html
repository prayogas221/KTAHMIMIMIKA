<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTA HMI Mimika - Cetak</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family:'Poppins', sans-serif; margin:0; padding:0; background:#f0f0f0; }

/* LOGIN */
#loginPage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.6); z-index:999; }
#loginPage.hidden { display:none; }
#loginPage input { width:100%; padding:0.5rem; margin-bottom:0.5rem; border-radius:0.5rem; border:1px solid #ccc; }

/* KTA CARD */
.kta-card { 
  background:white; border:2px solid #2d5016; border-radius:1rem; box-shadow:0 4px 10px rgba(0,0,0,0.1); 
  display:flex; gap:1rem; padding:1rem; align-items:flex-start; 
  position:relative; overflow:hidden;
}
.kta-left { width:120px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; }
.kta-left img { border-radius:0.75rem; object-fit:cover; width:100px; height:120px; border:2px solid #2d5016; }
.kta-right { flex:1; display:flex; flex-direction:column; justify-content:space-between; }
.kta-right h2 { font-size:1.1rem; font-weight:700; margin-bottom:0.25rem; }
.kta-right p { font-size:0.85rem; margin:1px 0; }
.kta-ttd-qr { display:flex; justify-content:space-between; align-items:center; margin-top:0.5rem; }
.kta-ttd-qr img { width:80px; height:40px; object-fit:contain; }
.kta-qr { display:flex; flex-direction:column; align-items:center; font-size:0.65rem; }
.timestamp { font-size:0.6rem; color:#555; margin-top:4px; text-align:right; }

.kta-print-btn { margin-top:0.5rem; padding:0.3rem 0.6rem; background:#2d5016; color:white; border-radius:0.3rem; cursor:pointer; font-size:0.75rem; }

@media print {
  body { background:white; }
  .kta-card { page-break-inside: avoid; }
}
</style>
</head>
<body class="p-6">

<!-- LOGIN -->
<div id="loginPage">
  <div class="bg-white p-6 rounded-xl shadow-lg w-80">
    <h2 class="text-center font-bold text-lg mb-4">Login Admin KTA</h2>
    <input id="username" type="text" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()" class="w-full bg-green-700 text-white py-2 rounded mt-2 font-semibold">Login</button>
    <p id="loginError" class="text-red-500 text-sm mt-2 hidden">Username / Password salah!</p>
  </div>
</div>

<!-- Tombol cetak global -->
<div class="mb-4" id="controls" style="display:none;">
  <button onclick="generateKTA()" class="bg-green-700 text-white px-6 py-2 rounded font-semibold">Refresh / Generate KTA</button>
  <button onclick="downloadPDF()" class="bg-blue-600 text-white px-6 py-2 rounded font-semibold">Download PDF Semua</button>
</div>

<div id="kta-container" class="grid grid-cols-2 gap-6"></div>

<script>
// ===== LOGIN =====
const ADMIN_USER = "adminhmi";
const ADMIN_PASS = "mimika2026";

function login(){
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  if(u===ADMIN_USER && p===ADMIN_PASS){
    localStorage.setItem('ktaLogin','true');
    showApp();
  }else{
    document.getElementById('loginError').classList.remove('hidden');
  }
}

function showApp(){
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('controls').style.display='block';
}

if(localStorage.getItem('ktaLogin')==='true'){
  showApp();
}

// ===== DATA ANGGOTA =====
const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSaGF4w9j1HOTUJcpdBltUZ4N2hkZIqUpD6tJ4OkKkuHaYkWObiKnloTYC0rK1at5UYA16GmPUm7BNa/pub?gid=0&single=true&output=csv';
const defaultTTD = 'https://raw.githubusercontent.com/prayogas221/KTAHMIMIMIKA/532122c56719c026efcea792e03b13f7ddc44127/ttd.png';
let membersData = [];

async function loadMembers(){
  const res = await fetch(csvUrl);
  const text = await res.text();
  const rows = text.split('\n').slice(1);
  membersData = rows.map(r=>{
    const cols = r.split(',');
    return {
      id: cols[0],
      nik: cols[3],
      nama: cols[4],
      komisariat: cols[13],
      status: cols[10],
      foto: cols[14] || 'https://via.placeholder.com/100x120?text=Foto',
      ttd: cols[15] || defaultTTD
    };
  });
}

// ===== QR =====
async function generateQR(text){
  return await QRCode.toDataURL(text,{width:100, margin:1});
}

// ===== RENDER KTA =====
async function generateKTA(){
  const container = document.getElementById('kta-container');
  container.innerHTML='';
  const now = new Date();
  const timestamp = now.toLocaleString();
  for(const m of membersData){
    const qr = await generateQR(m.id);
    const card = document.createElement('div');
    card.className='kta-card';
    card.id = 'kta-'+m.id;
    card.innerHTML = `
      <div class="kta-left">
        <img src="${m.foto}" alt="Foto">
      </div>
      <div class="kta-right">
        <div>
          <h2>${m.nama}</h2>
          <p>NIK: ${m.nik}</p>
          <p>Komisariat: ${m.komisariat}</p>
          <p>Status: ${m.status}</p>
        </div>
        <div class="kta-ttd-qr">
          <img src="${m.ttd}" alt="TTD" class="kta-ttd">
          <div class="kta-qr">
            <img src="${qr}" alt="QR">
            <span>${m.id}</span>
          </div>
        </div>
        <div class="timestamp">Dicetak: ${timestamp}</div>
        <button class="kta-print-btn" onclick="printSingleKTA('${m.id}')">Cetak KTA Ini</button>
      </div>
    `;
    container.appendChild(card);
  }
}

// ===== CETAK SATU KTA =====
function printSingleKTA(id){
  const card = document.getElementById('kta-'+id);
  const win = window.open('', '', 'width=800,height=600');
  win.document.write(`
    <html>
    <head>
      <title>Cetak KTA</title>
      <style>
        body{display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}
        .kta-card{border:2px solid #2d5016; border-radius:1rem; padding:1rem; width:400px; display:flex; gap:1rem; flex-direction:row;}
        .kta-left img{width:100px;height:120px;border:2px solid #2d5016; border-radius:0.75rem; object-fit:cover;}
        .kta-right{flex:1; display:flex; flex-direction:column; justify-content:space-between;}
        .kta-ttd-qr{display:flex; justify-content:space-between; margin-top:0.5rem;}
        .kta-qr img{width:80px;height:40px; object-fit:contain;}
      </style>
    </head>
    <body>
      ${card.outerHTML}
      <script>
        window.onload=function(){window.print();window.onafterprint=window.close;}
      <\/script>
    </body>
    </html>
  `);
  win.document.close();
}

// ===== DOWNLOAD PDF =====
async function downloadPDF(){
  const container = document.getElementById('kta-container');
  await Promise.all(Array.from(container.querySelectorAll('img')).map(img=>{
    if(img.complete) return Promise.resolve();
    return new Promise(res=>img.onload=res);
  }));
  html2pdf().set({
    margin:0.2,
    filename:'KTA_All.pdf',
    html2canvas:{scale:2, useCORS:true, allowTaint:true},
    jsPDF:{unit:'in', format:'a4', orientation:'portrait'}
  }).from(container).save();
}

// ===== INISIALISASI =====
(async()=>{ await loadMembers(); generateKTA(); })();
</script>
</body>
</html>
