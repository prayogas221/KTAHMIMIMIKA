<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTA HMI Mimika - Kartu ATM</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family:'Poppins', sans-serif; margin:0; padding:1cm; background:#f0f0f0; }
.kta-card { 
  width:8.5cm; 
  height:5.4cm; 
  background:white; 
  border:2px solid #2d5016; 
  border-radius:0.5rem; 
  display:flex; 
  padding:0.3rem; 
  gap:0.3rem; 
  box-sizing:border-box;
  flex-direction:row;
  align-items:center;
  font-size:0.65rem;
}
.kta-left img { width:40px; height:50px; border-radius:0.25rem; object-fit:cover; border:1px solid #2d5016;}
.kta-right { flex:1; display:flex; flex-direction:column; justify-content:space-between; }
.kta-right h2 { font-size:0.75rem; font-weight:700; margin:0 0 1px 0; }
.kta-right p { margin:1px 0; font-size:0.55rem; word-break:break-word; }
.kta-ttd-qr { display:flex; justify-content:space-between; align-items:center; margin-top:2px; gap:0.2rem;}
.kta-ttd-qr img { width:30px; height:15px; object-fit:contain; }
.kta-qr img { width:25px; height:25px; }
#kta-container { display:flex; flex-wrap:wrap; gap:0.5cm; }
#logo-hmi { position:absolute; top:1cm; right:1cm; width:40px; height:auto; }
@media print {
  body { background:white; padding:0.5cm; }
  #kta-container { display:flex; flex-wrap:wrap; gap:0.5cm; }
  .kta-card { box-shadow:none; page-break-inside:avoid; }
  #logo-hmi { position:absolute; top:0.5cm; right:0.5cm; width:40px; }
}
</style>
</head>
<body>

<!-- Logo HMI -->
<img id="logo-hmi" src="https://w7.pngwing.com/pngs/421/188/png-transparent-green-and-black-hmi-logo-against-blue-background-muslim-students-association-logo-universitas-islam-negeri-raden-intan-lampung-organization-chairman-hmi-muslim-students-association-logo-universitas.png" alt="Logo HMI">

<!-- Container KTA -->
<div id="kta-container"></div>

<!-- Download PDF Button -->
<div class="fixed bottom-4 left-1/2 transform -translate-x-1/2 flex gap-2">
<button onclick="downloadPDF()" class="bg-blue-600 text-white px-4 py-2 rounded font-semibold">Download PDF</button>
</div>

<script>
// Data Dummy (ganti CSV sesuai kebutuhan)
const membersData = [
  {
    id:'KTA001',
    nama:'Ahmad Fikri',
    nik:'1234567890123456',
    komisariat:'Komisariat Ekonomi',
    cabang:'Politeknik Amamapare Timika',
    status:'Aktif',
    foto:'https://via.placeholder.com/100x120?text=Foto',
    ttd:'https://raw.githubusercontent.com/prayogas221/KTAHMIMIMIKA/532122c56719c026efcea792e03b13f7ddc44127/ttd.png'
  },
  {
    id:'KTA002',
    nama:'Siti Rahma',
    nik:'2345678901234567',
    komisariat:'Komisariat Insan Cita',
    cabang:'Universitas Cenderawasih',
    status:'Aktif',
    foto:'https://via.placeholder.com/100x120?text=Foto',
    ttd:'https://raw.githubusercontent.com/prayogas221/KTAHMIMIMIKA/532122c56719c026efcea792e03b13f7ddc44127/ttd.png'
  }
];

async function generateQR(text){
  return await QRCode.toDataURL(text,{width:100, margin:1});
}

async function generateKTA(){
  const container = document.getElementById('kta-container');
  container.innerHTML = '';
  for(const m of membersData){
    const qr = await generateQR(m.id);
    const card = document.createElement('div');
    card.className = 'kta-card';
    card.innerHTML = `
      <div class="kta-left">
        <img src="${m.foto}" alt="Foto">
      </div>
      <div class="kta-right">
        <div>
          <h2>${m.nama}</h2>
          <p>NIK: ${m.nik}</p>
          <p>Komisariat: ${m.komisariat}</p>
          <p>Perguruan Tinggi (PT): ${m.cabang}</p>
          <p>Status: ${m.status}</p>
        </div>
        <div class="kta-ttd-qr">
          <img src="${m.ttd}" alt="TTD">
          <div class="kta-qr">
            <img src="${qr}" alt="QR">
          </div>
        </div>
      </div>
    `;
    container.appendChild(card);
  }
}

async function downloadPDF(){
  const container = document.getElementById('kta-container');
  await Promise.all(Array.from(container.querySelectorAll('img')).map(img=>{
    if(img.complete) return Promise.resolve();
    return new Promise(res=>img.onload=res);
  }));
  html2pdf().set({
    margin:0.5,
    filename:`KTA_HMI.pdf`,
    html2canvas:{scale:2, useCORS:true, allowTaint:true},
    jsPDF:{unit:'cm', format:'a4', orientation:'portrait'}
  }).from(container).save();
}

// Init
generateKTA();
</script>

</body>
</html>
