<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTA HMI Mimika - Kartu ATM</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family:'Poppins', sans-serif; margin:0; padding:1cm; background:#f0f0f0; }
#kta-container { display:flex; flex-wrap:wrap; gap:0.5cm; justify-content:center; }

/* Kartu ATM */
.kta-card { 
  width:8.5cm; 
  height:5.4cm; 
  background:white; 
  border:2px solid #2d5016; 
  border-radius:0.6rem; 
  display:flex; 
  flex-direction:row;
  padding:0.4rem; 
  gap:0.4rem;
  box-sizing:border-box;
  position:relative;
  align-items:center;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}
.kta-left img { width:50px; height:60px; border-radius:0.25rem; object-fit:cover; border:1px solid #2d5016;}
.kta-right { flex:1; display:flex; flex-direction:column; justify-content:space-between; padding-left:0.3rem; }
.kta-right h2 { font-size:0.78rem; font-weight:700; margin:0 0 2px 0; }
.kta-right p { margin:1px 0; font-size:0.58rem; word-break:break-word; }
.kta-ttd-qr { display:flex; justify-content:space-between; align-items:center; margin-top:2px; gap:0.2rem;}
.kta-ttd-qr img { width:30px; height:15px; object-fit:contain; border:1px solid #ccc; border-radius:2px; }
.kta-qr img { width:25px; height:25px; }
.kta-logo { position:absolute; top:0.25rem; right:0.25rem; width:28px; height:auto; }

/* Tombol PDF */
.download-pdf { position:fixed; bottom:1rem; left:50%; transform:translateX(-50%); z-index:1000; }

@media print {
  body { background:white; padding:0.5cm; }
  .kta-card { box-shadow:none; page-break-inside:avoid; }
}
</style>
</head>
<body>

<!-- Container KTA -->
<div id="kta-container"></div>

<!-- Download PDF Button -->
<div class="download-pdf">
<button onclick="downloadPDF()" class="bg-blue-600 text-white px-4 py-2 rounded font-semibold">Download PDF</button>
</div>

<script>
// URL Google Spreadsheet CSV
const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSaGF4w9j1HOTUJcpdBltUZ4N2hkZIqUpD6tJ4OkKkuHaYkWObiKnloTYC0rK1at5UYA16GmPUm7BNa/pub?gid=0&single=true&output=csv';

// Logo HMI transparan
const logoHMI = 'https://upload.wikimedia.org/wikipedia/commons/6/67/Lambang_HMI_%28Original%29.png';
const defaultTTD = 'https://raw.githubusercontent.com/prayogas221/KTAHMIMIMIKA/532122c56719c026efcea792e03b13f7ddc44127/ttd.png';

let membersData = [];

// Load CSV
async function loadMembers(){
  const res = await fetch(csvUrl);
  const text = await res.text();
  const rows = text.split('\n').slice(1); // skip header
  membersData = rows.map(r=>{
    const cols = r.split(',');
    return {
      id: cols[0],
      nik: cols[3],
      nama: cols[4],
      komisariat: cols[13]?.trim() || "Unknown",
      cabang: cols[12]?.trim() || "Unknown",
      status: cols[10]?.trim() || "Aktif",
      foto: cols[14] || 'https://via.placeholder.com/100x120?text=Foto',
      ttd: cols[15] || defaultTTD
    };
  });
}

// Generate QR
async function generateQR(text){
  return await QRCode.toDataURL(text,{width:100, margin:1});
}

// Generate KTA
async function generateKTA(){
  const container = document.getElementById('kta-container');
  container.innerHTML = '';
  for(const m of membersData){
    const qr = await generateQR(m.id);
    const card = document.createElement('div');
    card.className = 'kta-card';
    card.innerHTML = `
      <img src="${logoHMI}" alt="Logo HMI" class="kta-logo">
      <div class="kta-left">
        <img src="${m.foto}" alt="Foto">
      </div>
      <div class="kta-right">
        <div>
          <h2>${m.nama}</h2>
          <p>NIK: ${m.nik}</p>
          <p>Komisariat: ${m.komisariat}</p>
          <p>Perguruan Tinggi (PT): ${m.cabang}</p>
          <p>Status: ${m.status}</p>
        </div>
        <div class="kta-ttd-qr">
          <img src="${m.ttd}" alt="TTD">
          <div class="kta-qr">
            <img src="${qr}" alt="QR">
          </div>
        </div>
      </div>
    `;
    container.appendChild(card);
  }
}

// Download PDF
async function downloadPDF(){
  const container = document.getElementById('kta-container');
  await Promise.all(Array.from(container.querySelectorAll('img')).map(img=>{
    if(img.complete) return Promise.resolve();
    return new Promise(res=>img.onload=res);
  }));
  html2pdf().set({
    margin:0.5,
    filename:`KTA_HMI.pdf`,
    html2canvas:{scale:2, useCORS:true, allowTaint:true},
    jsPDF:{unit:'cm', format:'a4', orientation:'portrait'}
  }).from(container).save();
}

// Init
(async()=>{
  await loadMembers();
  await generateKTA();
})();
</script>

</body>
</html>
