<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cetak KTA HMI Mimika</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body{font-family:system-ui;background:#f1f5f9}
.hidden{display:none}
@media print{
  body{background:white}
  .no-print{display:none}
}
.kta-card{
  height:auto; border-radius:1rem; display:flex; gap:1rem; padding:1rem; align-items:center; position:relative;
}
.ttd{width:80px; height:40px; margin-top:8px;} /* diperpendek margin agar dekat foto */
.timestamp{font-size:8px; color:#ccc; margin-top:2px;}
</style>
</head>

<body class="p-4">

<!-- LOGIN -->
<div id="loginBox" class="max-w-md mx-auto bg-white p-6 rounded-xl shadow">
  <h2 class="text-2xl font-bold mb-4 text-center">Login Cetak KTA HMI Mimika</h2>
  <input id="user" placeholder="Username" class="border p-2 w-full mb-3 rounded">
  <input id="pass" type="password" placeholder="Password" class="border p-2 w-full mb-4 rounded">
  <button onclick="login()" class="bg-green-700 text-white w-full py-2 rounded">Masuk</button>
  <p id="loginErr" class="text-red-600 mt-2 hidden text-center">Login salah</p>
</div>

<!-- APP -->
<div id="app" class="hidden">

<header class="bg-gradient-to-r from-green-800 to-yellow-500 text-white text-center p-5 rounded-3xl shadow mb-6">
  <h1 class="text-3xl font-bold">CETAK KTA HMI MIMIKA</h1>
  <p id="roleText" class="mt-1 text-sm"></p>
</header>

<div class="flex gap-3 mb-6 justify-center no-print">
  <button onclick="showTab('data')" class="btn bg-gray-200 px-3 py-1 rounded">📋 Data</button>
  <button onclick="showTab('cetak')" class="btn bg-gray-200 px-3 py-1 rounded">🖨️ Cetak KTA</button>
  <button onclick="showTab('scan')" class="btn bg-gray-200 px-3 py-1 rounded">📷 Scan QR</button>
</div>

<!-- DATA -->
<div id="data" class="tabPage bg-white p-5 rounded-xl shadow">
  <div class="flex justify-between mb-3 no-print">
    <input id="search" oninput="render()" placeholder="Cari nama / NIK" class="border p-2 rounded w-1/2">
    <button onclick="downloadCSV()" class="bg-blue-600 text-white px-4 rounded">Download CSV</button>
  </div>

  <div class="overflow-auto">
    <table class="w-full text-sm border">
      <thead class="bg-amber-700 text-white">
        <tr>
          <th class="p-2 border">Foto</th>
          <th class="p-2 border">Nama</th>
          <th class="p-2 border">NIK</th>
          <th class="p-2 border">Komisariat</th>
          <th class="p-2 border">Status</th>
          <th class="p-2 border">QR</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- CETAK -->
<div id="cetak" class="tabPage hidden">
<div class="no-print flex justify-center gap-3 mb-4">
  <button onclick="window.print()" class="bg-green-700 text-white px-6 py-2 rounded">🖨️ PRINT A4</button>
  <button onclick="downloadPDFAll()" class="bg-blue-600 text-white px-6 py-2 rounded">📄 DOWNLOAD PDF Semua</button>
</div>
<div id="printArea" class="grid grid-cols-2 gap-4"></div>
</div>

<!-- SCAN QR -->
<div id="scan" class="tabPage hidden bg-white p-5 rounded-xl shadow">
  <h2 class="text-xl font-bold mb-3">Scan QR Anggota</h2>
  <video id="qrVideo" class="w-full rounded mb-3"></video>
  <p id="scanResult" class="mt-2 text-gray-700"></p>
  <div id="profileCard" class="hidden mt-3 rounded-xl flex gap-3 items-center"></div>
  <button id="downloadPDFBtn" class="bg-blue-600 text-white px-4 py-2 rounded mt-2 hidden" onclick="downloadPDFSingle()">📄 DOWNLOAD PDF</button>
</div>

<footer class="text-center mt-8 text-gray-500 no-print">IT Nesacip 2025</footer>

</div>

<script>
// ===== USER =====
const USERS={
 ekonomi:{pass:"12345",kom:"Komisariat Ekonomi"},
 insan:{pass:"12345",kom:"Komisariat Insan Cita"},
 lafran:{pass:"12345",kom:"Komisariat Lafran Pane"},
 cabang:{pass:"12345",kom:"ALL"}
};

let role=""; let rows=[];

// ===== SHEET =====
const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSaGF4w9j1HOTUJcpdBltUZ4N2hkZIqUpD6tJ4OkKkuHaYkWObiKnloTYC0rK1at5UYA16GmPUm7BNa/pub?gid=0&single=true&output=csv";

// ===== LOGIN =====
function login(){
 let u=user.value.trim(); let p=pass.value;
 if(USERS[u] && USERS[u].pass===p){
   role=USERS[u].kom;
   loginBox.classList.add("hidden");
   app.classList.remove("hidden");
   roleText.innerText="Akses: "+role;
   loadData();
 } else loginErr.classList.remove("hidden");
}

// ===== LOAD =====
async function loadData(){
 let t=await fetch(sheetURL).then(r=>r.text());
 let arr=t.split("\n").map(r=>r.split(","));
 arr.shift(); // header
 rows=arr;
 render();
 renderPrint();
}

// ===== FILTER =====
function filterRows(){
 let f=search?.value.toLowerCase()||"";
 return rows.filter(r=>{
   let komis=r[13];
   if(role!=="ALL" && komis!==role) return false;
   return r.join(" ").toLowerCase().includes(f);
 });
}

// ===== RENDER TABLE =====
function render(){
 let d=filterRows();
 tbody.innerHTML=d.map(r=>{
   let id=r[0];
   let fotoURL=r[14] || "https://via.placeholder.com/80x100.png?text=Foto";
   let qrURL = `https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=${id}`;
   return `<tr>
     <td class="border p-1"><img src="${fotoURL}" class="w-12 h-12 object-cover rounded"></td>
     <td class="border p-1">${r[4]}</td>
     <td class="border p-1">${r[3]}</td>
     <td class="border p-1">${r[13]}</td>
     <td class="border p-1">${r[10]}</td>
     <td class="border p-1"><img src="${qrURL}"></td>
   </tr>`;
 }).join("");
}

// ===== GENERATE QR BASE64 =====
async function generateQR(data){
 return await QRCode.toDataURL(data,{width:120,margin:1});
}

// ===== CETAK KTA MODERN GEN Z =====
const ttdURL = "https://raw.githubusercontent.com/prayogas221/KTAHMIMIMIKA/bc6dca93f67847406bc4bd06cef02f549cedfae4/ttd.png";

async function renderPrint(){
 let d = filterRows();
 printArea.innerHTML="";
 let now = new Date();
 let timestamp = now.toLocaleString();

 for(const r of d){
   let id=r[0];
   let fotoURL=r[14] || "https://via.placeholder.com/80x100.png?text=Foto";
   let qrBase64 = await generateQR(id);

   let div=document.createElement("div");
   div.className="kta-card p-4 flex gap-4 rounded-xl shadow-lg";
   div.style="background: linear-gradient(145deg, #0f3d1e, #050505); color:white; border:2px solid #0f3d1e;";

   div.innerHTML=`
<div class="flex flex-col justify-center items-center">
  <img src="${fotoURL}" class="w-24 h-28 object-cover rounded-xl border-2 border-white shadow-md">
  <img src="${ttdURL}" class="ttd shadow-md mt-2">
</div>
<div class="flex-1 flex flex-col justify-between text-sm">
  <div>
    <h2 class="text-lg font-bold tracking-wide">${r[4]}</h2>
    <p>NIK: <span class="font-mono">${r[3]}</span></p>
    <p>Komisariat: ${r[13]}</p>
    <p>Status: ${r[10]}</p>
  </div>
  <div class="flex flex-col items-center mt-2">
    <img src="${qrBase64}" class="w-24 h-24 border-2 border-white rounded-md">
    <span class="text-[10px] mt-1">${id}</span>
  </div>
  <div class="timestamp text-[9px] mt-2">Dicetak: ${timestamp}</div>
</div>`;
   printArea.appendChild(div);
 }
}

// ===== DOWNLOAD CSV =====
function downloadCSV(){
 let d=filterRows();
 let csv=d.map(r=>r.join(",")).join("\n");
 let blob=new Blob([csv],{type:"text/csv"});
 let a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="HMI_MIMIKA.csv";
 a.click();
}

// ===== DOWNLOAD PDF =====
function downloadPDFAll(){
 html2pdf().from(printArea).set({margin:0.2, filename:'KTA_All.pdf', html2canvas:{scale:2}}).save();
}

let currentProfileHTML="";
function downloadPDFSingle(){
 if(currentProfileHTML){
   let div=document.createElement("div");
   div.innerHTML=currentProfileHTML;
   html2pdf().from(div).set({margin:0.2, filename:'KTA_Single.pdf', html2canvas:{scale:2}}).save();
 }
}

// ===== TAB =====
function showTab(id){
 document.querySelectorAll(".tabPage").forEach(x=>x.classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
 if(id==="scan") startQR();
}

// ===== QR SCAN =====
let videoStream;
function startQR(){
 const video=document.getElementById("qrVideo");
 const canvas=document.createElement("canvas");
 const ctx=canvas.getContext("2d");
 const scanResult=document.getElementById("scanResult");
 const profileCard=document.getElementById("profileCard");
 const downloadBtn=document.getElementById("downloadPDFBtn");

 navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
 .then(stream=>{
   videoStream=stream;
   video.srcObject=stream;
   video.setAttribute("playsinline", true);
   video.play();
   requestAnimationFrame(tick);
 }).catch(e=>{scanResult.innerText="Tidak bisa akses kamera";});

 function tick(){
   if(video.readyState===video.HAVE_ENOUGH_DATA){
     canvas.width=video.videoWidth;
     canvas.height=video.videoHeight;
     ctx.drawImage(video,0,0,canvas.width,canvas.height);
     let imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
     let code=jsQR(imageData.data,canvas.width,canvas.height);
     if(code){
       scanResult.innerText="QR Terbaca: "+code.data;
       showProfile(code.data);
     } else requestAnimationFrame(tick);
   } else requestAnimationFrame(tick);
 }
}

async function showProfile(id){
 let r=rows.find(x=>x[0]===id);
 if(r){
   let fotoURL=r[14] || "https://via.placeholder.com/80x100.png?text=Foto";
   let qrBase64=await generateQR(id);
   let now=new Date();
   let timestamp=now.toLocaleString();
   currentProfileHTML=`
<div class="kta-card p-4 flex gap-4 rounded-xl shadow-lg" style="background: linear-gradient(145deg, #0f3d1e, #050505); color:white; border:2px solid #0f3d1e;">
<div class="flex flex-col justify-center items-center">
  <img src="${fotoURL}" class="w-24 h-28 object-cover rounded-xl border-2 border-white shadow-md">
  <img src="${ttdURL}" class="ttd shadow-md mt-2">
</div>
<div class="flex-1 flex flex-col justify-between text-sm">
  <div>
    <h2 class="text-lg font-bold tracking-wide">${r[4]}</h2>
    <p>NIK: <span class="font-mono">${r[3]}</span></p>
    <p>Komisariat: ${r[13]}</p>
    <p>Status: ${r[10]}</p>
  </div>
  <div class="flex flex-col items-center mt-2">
    <img src="${qrBase64}" class="w-24 h-24 border-2 border-white rounded-md">
    <span class="text-[10px] mt-1">${id}</span>
  </div>
  <div class="timestamp text-[9px] mt-2">Dicetak: ${timestamp}</div>
</div>
</div>`;
   profileCard.innerHTML=currentProfileHTML;
   profileCard.classList.remove("hidden");
   downloadBtn.classList.remove("hidden");
 }
}

// ===== STOP CAMERA saat keluar tab =====
document.querySelectorAll(".tabPage").forEach(tab=>{
  tab.addEventListener("transitionend",()=>{
    if(tab.id!=="scan" && videoStream){videoStream.getTracks().forEach(t=>t.stop());}
  })  
});
</script>
</body>
</html>
