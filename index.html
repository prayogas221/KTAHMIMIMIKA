<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cetak KTA HMI Mimika</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<style>
body{font-family:system-ui;background:#f1f5f9;}
.hidden{display:none;}
.no-print{display:none !important;}
.kta-card{
  display:flex;
  flex-direction:row;
  background:white;
  border-radius:1rem;
  border:1px solid #ccc;
  overflow:hidden;
  height:180px;
  width:320px;
  position:relative;
  font-family:system-ui;
}
.kta-left, .kta-right{
  width:40px;
  background:linear-gradient(to bottom, #0f3d1e, #050505);
}
.kta-center{
  flex:1;
  display:flex;
  flex-direction:row;
  padding:10px;
}
.kta-photo{
  width:80px;
  height:120px;
  object-fit:cover;
  border-radius:0.5rem;
  border:1px solid #0f3d1e;
}
.kta-info{
  flex:1;
  margin-left:10px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.kta-info h2{font-weight:bold;font-size:16px;color:#0f3d1e;}
.kta-info p{font-size:12px;color:#333;margin:1px 0;}
.kta-qr{
  display:flex;
  flex-direction:column;
  align-items:center;
}
.kta-qr img{width:60px;height:60px;}
.kta-ttd{width:70px;height:35px;margin-top:5px;}
.timestamp{font-size:8px;color:#555;margin-top:2px;text-align:right;}
</style>
</head>
<body class="p-4">

<div class="flex justify-center gap-3 mb-4">
  <button onclick="downloadPDFAll()" class="bg-green-700 text-white px-6 py-2 rounded">📄 DOWNLOAD PDF Semua</button>
</div>

<div id="printArea" class="grid grid-cols-2 gap-4"></div>

<script>
const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQuZEZBPmhPirNxmYQaupTMPbP1VkQ4rcLLQ_hhS1kt_0oA88_DUgdc3-4JD32zCtYTmG3qzZutyvzD/pub?gid=0&single=true&output=csv";
const ttdURL="https://raw.githubusercontent.com/prayogas221/KTAHMIMIMIKA/main/ttd.png"; // harus public URL TTD
let rows=[];

// ===== LOAD DATA =====
async function loadData(){
  let t = await fetch(sheetURL).then(r=>r.text());
  let arr = t.split("\n").map(r=>r.split(","));
  arr.shift(); // remove header
  rows = arr;
  renderPrint();
}

// ===== GENERATE QR =====
async function generateQR(data){
  return await QRCode.toDataURL(data,{width:120,margin:1});
}

// ===== RENDER PRINT =====
async function renderPrint(){
  const printArea=document.getElementById("printArea");
  printArea.innerHTML="";
  const now=new Date();
  const timestamp=now.toLocaleString();

  for(const r of rows){
    let id=r[0];
    let nama=r[4];
    let nik=r[3];
    let komisariat=r[13];
    let status=r[10];
    let fotoURL = r[14] || "https://via.placeholder.com/80x120.png?text=Foto";
    let qrBase64 = await generateQR(id);

    let div=document.createElement("div");
    div.className="kta-card";

    div.innerHTML=`
      <div class="kta-left"></div>
      <div class="kta-center">
        <img class="kta-photo" src="${fotoURL}" />
        <div class="kta-info">
          <div>
            <h2>${nama}</h2>
            <p>NIK: ${nik}</p>
            <p>Komisariat: ${komisariat}</p>
            <p>Status: ${status}</p>
          </div>
          <div class="flex justify-between items-center">
            <div class="kta-qr">
              <img src="${qrBase64}" />
              <span style="font-size:10px;">${id}</span>
            </div>
            <img src="${ttdURL}" class="kta-ttd" />
          </div>
          <div class="timestamp">Dicetak: ${timestamp}</div>
        </div>
      </div>
      <div class="kta-right"></div>
    `;
    printArea.appendChild(div);
  }
}

// ===== DOWNLOAD PDF =====
async function downloadPDFAll(){
  const imgs = document.querySelectorAll("img");
  await Promise.all(Array.from(imgs).map(img=>{
    if(img.complete) return Promise.resolve();
    return new Promise(res=>img.onload=res);
  }));

  html2pdf().set({
    margin:0.2,
    filename:'KTA_All.pdf',
    html2canvas:{scale:2,useCORS:true,allowTaint:true},
    jsPDF:{unit:'in', format:'a4', orientation:'portrait'}
  }).from(document.getElementById("printArea")).save();
}

loadData();
</script>
</body>
</html>
