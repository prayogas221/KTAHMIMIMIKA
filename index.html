<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTA HMI Mimika - Full Cabang Access</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family:'Poppins', sans-serif; margin:0; padding:0; background:#f0f0f0; }
.hidden { display:none; }

/* KTA Card */
.kta-card { 
  background:white; 
  border:2px solid #2d5016; 
  border-radius:1rem; 
  display:flex; 
  flex-direction:column;
  padding:0.5rem; 
  width:8.5cm;
  height:5.4cm;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  position:relative;
}
.kta-logo { position:absolute; top:5px; right:5px; width:50px; height:50px; }
.kta-top { display:flex; gap:0.5rem; }
.kta-left { width:100px; flex-shrink:0; }
.kta-left img { width:100px; height:120px; object-fit:cover; border-radius:0.5rem; border:1px solid #2d5016; }
.kta-right { flex:1; display:flex; flex-direction:column; justify-content:space-between; font-size:0.75rem; }
.kta-right h2 { font-size:0.9rem; font-weight:700; margin:0; }
.kta-right p { margin:1px 0; }
.kta-ttd-qr { display:flex; justify-content:space-between; align-items:center; margin-top:2px; }
.kta-ttd-qr img { height:30px; object-fit:contain; }
.kta-qr { display:flex; flex-direction:column; align-items:center; font-size:0.65rem; }
.timestamp { font-size:0.55rem; color:#555; text-align:right; }

/* Login Form */
#login-form input { font-size:0.9rem; }
#login-form button { font-size:0.9rem; }

@media print {
  body { background:white; padding:0; }
  #kta-container { display:grid; grid-template-columns:repeat(auto-fit, minmax(8.5cm,1fr)); gap:1cm; }
  .kta-card { box-shadow:none; break-inside:avoid; }
}
</style>
</head>
<body class="p-6">

<!-- LOGIN -->
<div id="login-form" class="max-w-sm mx-auto mt-10 p-6 bg-white rounded shadow">
<h1 class="text-2xl font-bold mb-4 text-center">Login Komisariat / Cabang</h1>
<div class="mb-4">
<label class="block mb-1 font-semibold">Username</label>
<input type="text" id="username" class="w-full px-3 py-2 border rounded" placeholder="Nama komisariat / cabang">
</div>
<div class="mb-4">
<label class="block mb-1 font-semibold">Password</label>
<input type="password" id="password" class="w-full px-3 py-2 border rounded" placeholder="Password">
</div>
<button onclick="login()" class="w-full bg-green-700 text-white py-2 rounded font-semibold">Login</button>
<p id="login-error" class="text-red-500 mt-2 hidden text-center">Username atau password salah!</p>
</div>

<!-- KTA PAGE -->
<div id="kta-page" class="hidden">
<div class="mb-4 flex flex-col md:flex-row md:items-center md:gap-4">
<select id="komisariatFilter" class="px-4 py-2 border rounded" disabled></select>
<div class="flex gap-2 mt-2 md:mt-0">
<button onclick="generateKTA()" class="bg-green-700 text-white px-6 py-2 rounded font-semibold">Cetak / Print KTA</button>
<button onclick="downloadPDF()" class="bg-blue-600 text-white px-6 py-2 rounded font-semibold">Download PDF Semua</button>
<button onclick="logout()" class="bg-gray-600 text-white px-6 py-2 rounded font-semibold">Logout</button>
</div>
</div>
<div id="kta-container" class="grid grid-cols-2 gap-6"></div>
</div>

<script>
// USERS
const users = {
  "Komisariat Ekonomi": { password:"ekonomi123", type:"komisariat" },
  "Komisariat Insan Cita": { password:"insancita123", type:"komisariat" },
  "Komisariat Lafran Pane": { password:"lafran123", type:"komisariat" },
  "Cabang Mimika": { password:"cabang123", type:"cabang" }
};

// CSV & LOGO
const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSaGF4w9j1HOTUJcpdBltUZ4N2hkZIqUpD6tJ4OkKkuHaYkWObiKnloTYC0rK1at5UYA16GmPUm7BNa/pub?gid=0&single=true&output=csv';
const logoHMI = 'https://upload.wikimedia.org/wikipedia/commons/6/67/Lambang_HMI_%28Original%29.png';
const defaultTTD = 'https://raw.githubusercontent.com/prayogas221/KTAHMIMIMIKA/main/ttd.png';
const qrBaseUrl = 'https://sites.google.com/view/database-kader-hmi-cabang-pers/halaman-muka/profil-anggota?memberID=';

let membersData = [];
let currentUser = "";

// LOAD MEMBERS
async function loadMembers(){
  const res = await fetch(csvUrl);
  const text = await res.text();
  const rows = text.split('\n').slice(1);
  membersData = rows.map(r=>{
    const cols = r.split(',');
    return {
      id: cols[0],
      nama: cols[1],
      nik: cols[2],
      komisariat: cols[3]?.trim() || "Unknown",
      cabang: cols[4]?.trim() || "Mimika",
      status: cols[5]?.trim() || "Aktif",
      foto: cols[6] || 'https://via.placeholder.com/100x120?text=Foto',
      ttd: cols[7] || defaultTTD,
      kategori_jabatan: cols[8] || "Anggota Biasa",
      posisi_spesifik: cols[9] || "-"
    };
  });
}

// LOGIN
function login(){
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  const error = document.getElementById('login-error');

  if(users[u] && users[u].password === p){
    currentUser = u;
    document.getElementById('login-form').classList.add('hidden');
    document.getElementById('kta-page').classList.remove('hidden');

    const select = document.getElementById('komisariatFilter');

    if(users[u].type === "komisariat"){
      select.innerHTML = `<option value="${u}">${u}</option>`;
      select.disabled = true;
    } else {
      const komisariatSet = new Set(membersData.map(m => m.komisariat));
      select.innerHTML = '<option value="all">Semua Komisariat</option>' +
        Array.from(komisariatSet).map(k=>`<option value="${k}">${k}</option>`).join('');
      select.disabled = false;
    }

    generateKTA();
    error.classList.add('hidden');
  } else {
    error.classList.remove('hidden');
  }
}

// LOGOUT
function logout(){
  currentUser = "";
  document.getElementById('kta-page').classList.add('hidden');
  document.getElementById('login-form').classList.remove('hidden');
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
}

// GENERATE QR
async function generateQR(url){
  return await QRCode.toDataURL(url,{width:100, margin:1});
}

// GENERATE KTA
async function generateKTA(){
  const container = document.getElementById('kta-container');
  container.innerHTML = '';
  const now = new Date();
  const timestamp = now.toLocaleString();

  const filterValue = document.getElementById('komisariatFilter').value;
  let filteredMembers;

  if(currentUser === "Cabang Mimika"){ 
    filteredMembers = filterValue === "all" ? membersData : membersData.filter(m => m.komisariat === filterValue);
  } else {
    filteredMembers = membersData.filter(m => m.komisariat === currentUser);
  }

  for(const m of filteredMembers){
    const qrUrl = qrBaseUrl + encodeURIComponent(m.id);
    const qr = await generateQR(qrUrl);

    const card = document.createElement('div');
    card.className = 'kta-card';
    card.innerHTML = `
      <img src="${logoHMI}" class="kta-logo" alt="Logo HMI">
      <div class="kta-top">
        <div class="kta-left"><img src="${m.foto}" alt="Foto"></div>
        <div class="kta-right">
          <div>
            <h2>${m.nama}</h2>
            <p>NIK: ${m.nik}</p>
            <p>Komisariat: ${m.komisariat}</p>
            <p>Perguruan Tinggi (PT): ${m.cabang}</p>
            <p>Status: ${m.status}</p>
            <p>Jabatan: ${m.kategori_jabatan}</p>
          </div>
          <div class="kta-ttd-qr">
            <img src="${m.ttd}" alt="TTD">
            <div class="kta-qr">
              <img src="${qr}" alt="QR">
              <span>${m.id}</span>
            </div>
          </div>
          <div class="timestamp">Dicetak: ${timestamp}</div>
        </div>
      </div>
    `;
    container.appendChild(card);
  }
}

// DOWNLOAD PDF
async function downloadPDF(){
  const container = document.getElementById('kta-container');
  await Promise.all(Array.from(container.querySelectorAll('img')).map(img=>{
    if(img.complete) return Promise.resolve();
    return new Promise(res=>img.onload=res);
  }));
  html2pdf().set({
    margin:0.2,
    filename:`KTA_${currentUser}.pdf`,
    html2canvas:{scale:2, useCORS:true, allowTaint:true},
    jsPDF:{unit:'in', format:'a4', orientation:'portrait'}
  }).from(container).save();
}

// INIT
(async()=>{ await loadMembers(); })();
</script>
</body>
</html>
